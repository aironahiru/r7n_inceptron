<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Inceptron logo</title>
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4FF7CC"/><stop offset="0.08" stop-color="#14E1D5"/><stop offset="0.17" stop-color="#03C8D7"/><stop offset="0.25" stop-color="#0CB0D4"/><stop offset="0.33" stop-color="#0B98CF"/><stop offset="0.42" stop-color="#007ED1"/><stop offset="0.5" stop-color="#1F5ED9"/><stop offset="0.58" stop-color="#7655F2"/><stop offset="0.67" stop-color="#B748F1"/><stop offset="0.75" stop-color="#F535D5"/><stop offset="0.83" stop-color="#F126A9"/><stop offset="0.92" stop-color="#E91D7E"/><stop offset="1" stop-color="#DD1B57"/></linearGradient>
