  <style>
    .pane { animation: pane 6s ease-in-out infinite; }
    .p2 { animation-delay: .35s; } .p3 { animation-delay: .7s; } .p4 { animation-delay: 1.05s; }
    .qed { animation: qed 6s ease-in-out infinite; animation-delay: 1.4s; transform-box: fill-box; transform-origin: center; }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .t2 { animation-delay: 1.1s; } .t3 { animation-delay: 2.2s; }
    @keyframes pane { 0%, 100% { opacity: 1; } 45% { opacity: .55; } }
    @keyframes qed { 0%, 100% { transform: scale(1); } 45% { transform: scale(.9); } }
    @keyframes twinkle { 0%, 100% { opacity: .95; transform: scale(1); } 50% { opacity: .35; transform: scale(.55); } }
    @media (prefers-reduced-motion: reduce) { .pane, .qed, .twinkle { animation: none; } }
  </style>
