  <style>
    .twinkle { animation: twinkle 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .t2 { animation-delay: 1.5s; } .t3 { animation-delay: 3s; }
    .glint { animation: glint 7s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .95; transform: scale(1); } 50% { opacity: .4; transform: scale(.6); } }
    @keyframes glint { 0%, 100% { opacity: .9; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .twinkle, .glint { animation: none; } }
  </style>
