name: 💡 Idea or feature request
description: Suggest something Inceptron should be able to do.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Inceptron is being designed in the open, so ideas are very welcome, big or small.
  - type: textarea
    id: goal
    attributes:
      label: What would you like to do?
      description: Describe the problem, or the theorem you'd like to prove. Concrete examples help a lot.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could Inceptron help?
      description: What would the feature, syntax or behaviour look like? Sketches and pseudo-proofs are great.
  - type: textarea
    id: prior-art
    attributes:
      label: Prior art and alternatives
      description: Other tools, papers or approaches we should look at.
