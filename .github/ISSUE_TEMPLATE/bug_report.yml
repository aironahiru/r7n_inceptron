name: 🐛 Bug report
description: Something isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you share, the faster we can fix it.
  - type: checkboxes
    id: soundness
    attributes:
      label: Soundness
      description: A soundness bug lets Inceptron accept a proof of a false statement. These get top priority.
      options:
        - label: This looks like a soundness bug.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The smallest input or proof script that shows the problem, if you have one.
      render: text
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v0.1.0 or a1b2c3d
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Operating system, editor, anything else that might be relevant.
